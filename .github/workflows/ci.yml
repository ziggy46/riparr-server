# Cheap checks on every push. The Docker image itself isn't built here: building it means
# accepting MakeMKV's licence, which is the person building it's call, not CI's.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Python parses, and every name resolves
        run: |
          python -m compileall -q server/riparr tools
          pip install -q pyflakes
          pyflakes server/riparr tools > flakes.txt || true
          if grep "undefined name" flakes.txt; then exit 1; fi

      - name: JavaScript parses
        run: |
          node --check server/static/app.js
          node --check server/static/icons.js

      - name: Shell scripts parse
        run: for f in deploy/*.sh tools/*.sh packaging/*.sh; do bash -n "$f"; done

      - name: Tests
        run: |
          cd server
          pip install -q -r requirements.txt
          for t in *.test.py; do echo "== $t"; RIPARR_MOCK=1 python "$t"; done

      - name: Compose file is valid
        run: docker compose config -q
