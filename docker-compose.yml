services:
  riparr:
    image: ghcr.io/ziggy46/riparr-server:latest
    # To build it yourself from this checkout instead:  docker compose build
    build: .
    container_name: riparr
    restart: unless-stopped
    environment:
      # "yes" means you have read and accept MakeMKV's licence:
      # https://www.makemkv.com/eula/  The first start then compiles MakeMKV into
      # ./data, which takes a few minutes; later starts reuse it.
      MAKEMKV_ACCEPT_EULA: "no"
      # Who owns the files Riparr writes. `id` on the host shows yours.
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      # Networks to look for your NAS on, if the setup wizard's scan finds nothing.
      # RIPARR_SCAN_SUBNETS: "192.168.1.0/24"
    ports:
      - "9797:9797"
    # Lets Riparr use any optical drive the host has, and pick one up when it's plugged
    # in later, without naming device nodes: sr* is block major 11, sg* char major 21.
    # MakeMKV hangs at 100% CPU under Docker's default limit of ~1 billion open files.
    # Riparr caps it at start-up too; this keeps it right if that ever changes.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    device_cgroup_rules:
      - "b 11:* rmw"
      - "c 21:* rmw"
    # Or name the drive's nodes yourself instead (`lsscsi -g` on the host). Keep the
    # same names inside as outside.
    # devices:
    #   - /dev/sr0:/dev/sr0
    #   - /dev/sg2:/dev/sg2
    volumes:
      - ./data:/data
      - ./staging:/srv/staging
      # Optional: rip straight into your library instead of copying over SMB.
      # Mount the share on the host, then bind it here. Only the default share
      # in Riparr uses this path.
      # - /mnt/nas/media:/srv/library
